on:
    push:
        branches:
            - main
    pull_request:
        types: [opened, synchronize, reopened]
    # Called by release.yml, so a manual release runs these exact tests instead of
    # a second copy of them that can drift.
    workflow_call:

jobs:
    build:
        name: build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            # pnpm must be installed before setup-node: setup-node@v5 caches the
            # store automatically because package.json has "packageManager".
            - name: Install pnpm
              # Version comes from "packageManager" in package.json
              uses: pnpm/action-setup@v6
            - name: Use Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '24.x'
            - name: Install dependencies
              run: pnpm i

            - name: Build test containers
              run: make build-tests

            - name: Run tests in Docker
              run: make test-ci
